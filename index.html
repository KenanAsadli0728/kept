<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owed-Value Ledger</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1b1d1f;--mute:#6a6f73;--line:#e3e1da;--accent:#0f6b5c;--accent-ink:#fff;--soft:#e6f2ef;--warn:#b4531a;--warnbg:#fbeee3;--bad:#a8261f;--badbg:#fbe7e5;--silent:#5b4bb0;--silentbg:#ece9fa}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161a;--card:#1d2025;--ink:#ecebe6;--mute:#9aa0a6;--line:#2c3036;--accent:#3fb59f;--accent-ink:#06211c;--soft:#173630;--warn:#f0a066;--warnbg:#3a2616;--bad:#f0837c;--badbg:#3b1d1b;--silent:#b3a8f5;--silentbg:#2a2547}}
:root[data-theme=dark]{--bg:#14161a;--card:#1d2025;--ink:#ecebe6;--mute:#9aa0a6;--line:#2c3036;--accent:#3fb59f;--accent-ink:#06211c;--soft:#173630;--warn:#f0a066;--warnbg:#3a2616;--bad:#f0837c;--badbg:#3b1d1b;--silent:#b3a8f5;--silentbg:#2a2547}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.tag{color:var(--mute);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font:inherit;color:var(--mute);cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.1fr .9fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;color:var(--accent);line-height:1.1}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em}.kpi span{color:var(--mute);font-size:12.5px}
h2{font-size:15px;margin:0 0 10px}
.mute{color:var(--mute)}.small{font-size:13px}
.iou{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.iou:first-child{border-top:0}
.ico{width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;margin-left:6px;font-weight:600;vertical-align:1px}
.p-exp{background:var(--soft);color:var(--accent)}.p-sil{background:var(--silentbg);color:var(--silent)}.p-rev{background:var(--warnbg);color:var(--warn)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.old{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--mute);font-size:13px}
label{display:block;font-size:13px;margin:10px 0 2px}label span{float:right;font-variant-numeric:tabular-nums;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=number]{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.act{font:inherit;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
button.sec{font:inherit;background:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;overflow:auto;margin:6px 0 0;white-space:pre-wrap}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:6px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}th{color:var(--mute);font-weight:500;border-top:0}
.good{color:var(--accent)}.badc{color:var(--bad)}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Owed-Value Ledger</h1><div class="tag">Loyalty programs track what customers owe the brand. This tracks what the brand owes the customer, and pays it unasked.</div></div>
    <button class="sec" id="theme">Theme</button>
  </header>
  <nav role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<script src="engine.js"></script>
<script>
const $ = (s, el=document) => el.querySelector(s);
const usd = n => '$' + n.toFixed(2);
const usd0 = n => '$' + Math.round(n).toLocaleString();
const pct = (n,d=1) => (n*100).toFixed(d) + '%';

const S = { tab:'cust', N:5000, P:{...OVL.DEFAULT_PARAMS, incidentWh:null}, sim:{...OVL.DEFAULT_SIM}, cust:0, mayaLate:47, customers:null, res:null };

function boot(){
  S.customers = OVL.generate(S.N, 7);
  recompute();
  render();
}
function recompute(){
  S.customers[0] = OVL.makeMaya();
  S.customers[0].orders[0].lateMin = S.mayaLate;
  S.res = OVL.run(S.customers, S.P);
}

const TABS = [['cust','Customer view'],['rules','Promise contracts'],['ops','Ops & abuse guard'],['exp','Holdout experiment']];
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([k,l]) => `<button role="tab" aria-selected="${S.tab===k}" data-t="${k}">${l}</button>`).join('');
  $('#tabs').onclick = e => { const t = e.target.dataset.t; if(t){ S.tab=t; render(); } };
}
function render(){ renderTabs(); ({cust:vCust, rules:vRules, ops:vOps, exp:vExp})[S.tab](); }

/* ---------- Customer view ---------- */
function iouHTML(i){
  const T = OVL.TYPES[i.type];
  const pill = i.status==='review' ? `<span class="pill p-rev">held for review</span>`
    : i.salience==='explicit' ? `<span class="pill p-exp">you were told</span>` : `<span class="pill p-sil">quietly settled</span>`;
  return `<div class="iou"><div class="ico">${T.icon}</div><div><div><b>${T.label}</b> · ${i.label}${pill}</div><div class="small mute">${i.status==='review' ? 'Being checked by a person before we pay it.' : i.note}</div></div><div class="amt">${i.status==='review'?'<span class="mute">'+usd(i.amount)+'</span>':'+'+usd(i.amount)}</div></div>`;
}
function vCust(){
  const c = S.customers.find(x=>x.id===S.cust) || S.customers[0];
  const L = S.res.ledger.get(c.id);
  const paid = L.filter(i=>i.status==='settled');
  const total = paid.reduce((s,i)=>s+i.amount,0);
  const contacts = L.length;
  $('#view').innerHTML = `
  <div class="grid g2">
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>${c.name} · what we owe you</h2>
        <div class="row"><select id="pick">${[0,1,2,3,4,5].map(i=>`<option value="${i}" ${S.cust===i?'selected':''}>${i===0?'Maya (demo story)':'Customer #'+i}</option>`).join('')}${S.cust>5?`<option selected>Customer #${S.cust}</option>`:''}</select><button class="sec" id="rand">Random</button></div></div>
      <div class="big">${usd(total)}</div>
      <div class="small mute">returned automatically · ${paid.length} item(s) · 0 contacts needed</div>
      <div style="margin-top:8px">${L.length ? L.map(iouHTML).join('') : '<p class="mute">Nothing owed right now. We checked every promise we made you.</p>'}</div>
    </div>
    <div class="grid">
      <div class="card"><h2>Without the ledger</h2>
        <div class="old">You would need <b>${contacts}</b> separate claim${contacts===1?'':'s'}, probably repeating your story, and you would have to know you were owed anything at all.</div>
        <div class="small mute" style="margin-top:8px">Dixon et al.: 96% of high-effort customers become more disloyal vs 9% of low-effort ones.</div></div>
      ${c.id===0 ? `<div class="card"><h2>Try it: make Maya's delivery later</h2>
        <label>Minutes late <span id="mlv">${S.mayaLate}</span></label><input type="range" id="mlate" min="0" max="120" value="${S.mayaLate}">
        <div class="small mute" style="margin-top:6px">Credit is graduated (no cliff-edge), so operations cannot game a threshold. Grace is ${S.P.lateMin} min; full severity at +${S.P.lateRamp} min; cap ${usd(S.P.lateCap)}.</div></div>` : ''}
      <div class="card"><h2>Salience rule</h2>
        <div class="small"><span class="pill p-exp" style="margin-left:0">you were told</span> failures the customer noticed (waited for a late order): short factual note and money. No "we'll do better" promises; Uber's 1.5M-rider test found promises backfired.<br><br>
        <span class="pill p-sil" style="margin-left:0">quietly settled</span> failures they never noticed: the credit just appears. Apologising for unnoticed failures reduces repeat purchases.</div></div>
    </div>
  </div>`;
  $('#pick').onchange = e => { S.cust=+e.target.value; render(); };
  $('#rand').onclick = () => { S.cust = 1+Math.floor(Math.random()*(S.N-1)); render(); };
  const m = $('#mlate'); if(m) m.oninput = e => { S.mayaLate=+e.target.value; $('#mlv').textContent=S.mayaLate; recompute(); clearTimeout(window._m); window._m=setTimeout(()=>{ const y=scrollY; vCust(); scrollTo(0,y); const s=$('#mlate'); s&&s.focus(); },250); };
}

/* ---------- Promise contracts ---------- */
const SLIDERS = [
  ['lateMin','Late-delivery grace (min)',0,60,1],['latePct','Late credit, % of order',0,30,1],['lateCap','Late credit cap ($)',1,20,1],['lateRamp','Minutes to full severity',10,120,5],
  ['priceWindow','Price-protection window (days)',3,30,1],['expDays','Points "expiring soon" (days)',1,30,1],['minPts','Min points to auto-convert',100,3000,100],
  ['unusedDays','Unused add-on after (days)',14,120,1],['velocity','Velocity cap: late credits / 30d',1,10,1],['ringRatio','Ring flag: avg owed vs global ×',1.2,6,0.1]
];
function rulesOut(){
  const st = S.res.stats;
  $('#out').innerHTML = `<div class="card kpi"><b>${usd0(st.settled)}</b><span>auto-settled across ${st.nSettled.toLocaleString()} IOUs · ${st.withIOU.toLocaleString()} customers touched</span></div>
      ${OVL.CONTRACTS.map(k=>{ const b=st.byType[k.type]||{n:0,amt:0}; return `<div class="card"><div class="row" style="justify-content:space-between"><b>${k.id}</b><span class="amt">${usd0(b.amt)} · ${b.n}</span></div><pre>${k.yaml(S.P)}</pre></div>`; }).join('')}`;
}
function vRules(){
  $('#view').innerHTML = `
  <div class="grid g2">
    <div class="card"><h2>Tune the promises</h2><div class="small mute">Everything recomputes over ${S.N.toLocaleString()} synthetic customers.</div>
      ${SLIDERS.map(([k,l,a,b,s])=>`<label>${l} <span id="v_${k}">${S.P[k]}</span></label><input type="range" data-k="${k}" min="${a}" max="${b}" step="${s}" value="${S.P[k]}">`).join('')}
      <label>Incident: declare bad batch at warehouse</label>
      <select id="inc"><option value="">None</option>${['A','B','C','D'].map((w,i)=>`<option value="${i}" ${S.P.incidentWh===i?'selected':''}>Warehouse ${w}</option>`).join('')}</select>
      <div class="small mute" style="margin-top:4px">One declaration creates IOUs for every affected customer, not only the ones who complain.</div>
    </div>
    <div class="grid" id="out"></div>
  </div>`;
  rulesOut();
  document.querySelectorAll('input[data-k]').forEach(el => el.oninput = e => {
    S.P[e.target.dataset.k] = +e.target.value; $('#v_'+e.target.dataset.k).textContent = e.target.value;
    clearTimeout(window._t); window._t = setTimeout(()=>{ recompute(); rulesOut(); }, 60);
  });
  $('#inc').onchange = e => { S.P.incidentWh = e.target.value==='' ? null : +e.target.value; recompute(); vRules(); };
}

/* ---------- Ops & abuse ---------- */
function vOps(){
  const st = S.res.stats, ab = st.abuse;
  const types = Object.entries(OVL.TYPES);
  const max = Math.max(1, ...types.map(([k])=>(st.byType[k]||{amt:0}).amt));
  $('#view').innerHTML = `
  <div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><b>${usd0(st.settled)}</b><span>settled with zero contact</span></div>
    <div class="card kpi"><b>${st.nSettled.toLocaleString()}</b><span>IOUs paid automatically</span></div>
    <div class="card kpi"><b>${usd0(st.held)}</b><span>held by abuse guard (${st.nHeld} IOUs)</span></div>
    <div class="card kpi"><b>${pct(ab.precision,0)} / ${pct(ab.recall,0)}</b><span>flag precision / recall vs planted rings</span></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>Value returned by contract</h2>
      ${types.map(([k,t])=>{ const b=st.byType[k]||{n:0,amt:0}; return `<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><span>${t.icon} ${t.label} <span class="mute small">(${t.salience})</span></span><span class="amt">${usd0(b.amt)}</span></div><div class="bar"><i style="width:${b.amt/max*100}%"></i></div></div>`; }).join('')}
    </div>
    <div class="card"><h2>Review queue: suspicious clusters</h2>
      <div class="small mute">Customers linked by shared device, address or payment instrument, whose average owed value is ≥ ${S.P.ringRatio}× the global average. Households sharing an address are not flagged unless they also behave abnormally. Velocity cap: more than ${S.P.velocity} late credits in 30 days.</div>
      <table><tr><th>Cluster</th><th>Size</th><th>Avg owed</th><th>Held</th></tr>
      ${st.flagged.length ? st.flagged.map((f,i)=>`<tr><td>#${i+1}</td><td>${f.size}</td><td>${usd(f.avg)}</td><td class="badc">${usd0(f.held)}</td></tr>`).join('') : '<tr><td colspan="4" class="mute">No clusters flagged.</td></tr>'}</table>
      <div class="small mute" style="margin-top:8px">Anything held goes to a human. The system only auto-approves; it never auto-denies.</div>
    </div>
  </div>`;
}

/* ---------- Holdout experiment ---------- */
const SIMS = [['holdoutPct','Holdout share (%)',5,30,1],['base','Baseline 12-mo retention',0.5,0.95,0.01],['hit','Retention hit per noticed failure',0,0.1,0.005],['recover','Share of hit recovered by auto-credit',0,1,0.05],
  ['hassle','Hassle penalty per claim filed',0,0.06,0.005],['moneyEffect','Retention gain per $ credited',0,0.01,0.0005],['backfire','Backfire per unnoticed apology',0,0.03,0.0025],['margin','Annual margin per customer ($)',20,400,10]];
function expOut(){
  const r = OVL.simulate(S.customers, S.res.ledger, S.sim);
  const sig = Math.abs(r.uplift) > 1.96*r.se;
  $('#out').innerHTML = `    <div class="grid">
      <div class="card">
        <h2>Treated vs holdout</h2>
        <table><tr><th></th><th>Treated</th><th>Holdout (claim-based)</th></tr>
        <tr><td>Customers</td><td>${r.nT}</td><td>${r.nH}</td></tr>
        <tr><td>12-mo retention</td><td>${pct(r.pT)}</td><td>${pct(r.pH)}</td></tr>
        <tr><td>Avg payout</td><td>${usd(r.payT)}</td><td>${usd(r.payH)}</td></tr></table>
        <div style="margin-top:10px"><span class="big" style="font-size:30px;${r.uplift<0?'color:var(--bad)':''}">${r.uplift>=0?'+':''}${(r.uplift*100).toFixed(1)} pp</span> <span class="mute small">retention uplift ± ${(r.se*196).toFixed(1)} pp (95%) ${sig?'· significant':'· not significant at this holdout size'}</span></div>
      </div>
      <div class="card kpi">
        <b class="${r.net>=0?'good':'badc'}">${r.net>=0?'+':'−'}${usd0(Math.abs(r.net))}</b><span>net margin across ${r.nT} treated customers (retention margin − extra payouts + contacts avoided). ${usd(r.perCustomer)} per customer.</span>
        <div style="margin-top:10px"><b>${Math.round(r.contactsAvoided)}</b><span>support contacts avoided (${usd0(r.contactsAvoided*S.sim.contactCost)} at ${usd(S.sim.contactCost)} each)</span></div>
      </div>
      <div class="card small mute">Try switching to <b>Notify everything</b>: unnoticed-failure apologies erode the gain, which is why the settlement policy is salience-aware. If net margin is negative at your assumptions, narrow the contracts (the Promise contracts tab) until the holdout says otherwise.</div>
    </div>`;
}
function vExp(){
  $('#view').innerHTML = `
  <div class="grid g2">
    <div class="card"><h2>Assumptions</h2>
      <div class="note">This is a simulation, not evidence. Every behavioural coefficient below is an assumption you can change. The point: the ledger ships with a randomized holdout, so the real answer comes from live data.</div>
      <label>Settlement policy</label>
      <select id="pol"><option value="salience" ${S.sim.policy==='salience'?'selected':''}>Salience-aware (recommended)</option><option value="notifyAll" ${S.sim.policy==='notifyAll'?'selected':''}>Notify and apologise for everything</option></select>
      ${SIMS.map(([k,l,a,b,s])=>`<label>${l} <span id="s_${k}">${S.sim[k]}</span></label><input type="range" data-s="${k}" min="${a}" max="${b}" step="${s}" value="${S.sim[k]}">`).join('')}
    </div>
    <div class="grid" id="out"></div>
  </div>`;
  expOut();
  $('#pol').onchange = e => { S.sim.policy = e.target.value; expOut(); };
  document.querySelectorAll('input[data-s]').forEach(el => el.oninput = e => {
    S.sim[e.target.dataset.s] = +e.target.value; $('#s_'+e.target.dataset.s).textContent = e.target.value;
    clearTimeout(window._u); window._u = setTimeout(expOut, 60);
  });
}

$('#theme').onclick = () => {
  const d = document.documentElement, dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = d.dataset.theme || (dark?'dark':'light');
  d.dataset.theme = cur==='dark' ? 'light' : 'dark';
};
boot();
</script>
</body>
</html>
