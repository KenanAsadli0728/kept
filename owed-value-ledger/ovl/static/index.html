<div id="sharepanel" class="card" hidden style="margin-bottom:14px"></div>
<main id="main"></main>
<div class="footer-note">Value returned. Trust earned. &nbsp;·&nbsp; Owed-Value Ledger</div>
</div>
<script>
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd=n=>'$'+(+n).toFixed(2), usd0=n=>'$'+Math.round(+n).toLocaleString(), pc=(n,d=1)=>n==null?'n/a':(100*n).toFixed(d)+'%';
const api=(p,o)=>fetch(p,{cache:'no-store',...o}).then(async r=>{if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);return r.json()});
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
const ICON={late_delivery:'⏱',price_protection:'↓$',expiring_points:'★',unused_subscription:'⏸',devaluation_true_up:'⚖',silent_failure:'◇',incident:'⚠'};
const NAME={late_delivery:'Late delivery',price_protection:'Price protection',expiring_points:'Points kept from expiring',unused_subscription:'Unused add-on paused',devaluation_true_up:'Reward chart true-up',silent_failure:'Likely faulty order',incident:'Operations incident'};
const S={view:'cust',tab:'overview',cust:1,evCount:0,newIds:new Set(),cq:{q:'',segment:'',filter:'',offset:0},rq:{mode:'cases',contract:'',reason:'',offset:0}};

/* ---------------- tiny SVG charts ---------------- */
function lineChart(series,{w=460,h=210,xl='',yl='',xfmt=x=>x,yfmt=y=>y.toFixed(1)}={}){
  const pts=series.flatMap(s=>s.pts), xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(0,...ys),y1=Math.max(0,...ys); if(y1==y0)y1=y0+1;
  const L=44,R=10,T=8,B=30,X=x=>L+(x-x0)/((x1-x0)||1)*(w-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(h-T-B);
  let g=''; for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end">${yfmt(v)}</text>`}
  g+=`<line x1="${L}" x2="${w-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mute)" stroke-dasharray="3 3"/>`;
  [x0,(x0+x1)/2,x1].forEach(v=>g+=`<text x="${X(v)}" y="${h-14}" text-anchor="middle">${xfmt(v)}</text>`);
  g+=`<text x="${(L+w)/2}" y="${h-1}" text-anchor="middle">${xl}</text>`;
  const cols=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
  series.forEach((s,i)=>{g+=`<polyline fill="none" stroke="${cols[i%4]}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} points="${s.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}</svg><div class="legend">${series.map((s,i)=>`<span><i style="background:${cols[i%4]}"></i>${s.name}</span>`).join('')}</div>`;
}
function barChart(items,{w=460,h=190,yfmt=y=>pc(y,0),min=null}={}){
  const vals=items.flatMap(i=>[i.v,(i.lo??i.v),(i.hi??i.v)]); let y0=min??Math.min(0,...vals),y1=Math.max(...vals); if(y1==y0)y1=y0+1;
  const L=44,R=10,T=10,B=34,Y=y=>T+(1-(y-y0)/(y1-y0))*(h-T-B),bw=(w-L-R)/items.length;
  let g=''; for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end">${yfmt(v)}</text>`}
  items.forEach((it,i)=>{const x=L+i*bw+bw*.2,ww=bw*.6,cols=['var(--c1)','var(--c4)','var(--c3)','var(--c2)'];
    g+=`<rect x="${x}" y="${Math.min(Y(it.v),Y(0>y0?0:y0))}" width="${ww}" height="${Math.abs(Y(it.v)-Y(0>y0?0:y0))}" rx="3" fill="${it.c||cols[i%4]}"/>`;
    if(it.lo!=null)g+=`<line x1="${x+ww/2}" x2="${x+ww/2}" y1="${Y(it.lo)}" y2="${Y(it.hi)}" stroke="var(--ink)"/>`;
    g+=`<text x="${x+ww/2}" y="${h-18}" text-anchor="middle">${it.l}</text><text x="${x+ww/2}" y="${Y(it.v)-4}" text-anchor="middle" style="fill:var(--ink)">${yfmt(it.v)}</text>`});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}</svg>`;
}

/* ---------------- Customer view ---------------- */
function entryHTML(e){
  const pend=e.pending, cls=e.id&&S.newIds.has(e.id)?' new':'';
  const amount=e.currency_or_points==='POINTS'?`${Math.round(e.amount).toLocaleString()} pts<div class="tiny mute">${usd(e.value_usd)} value</div>`:(pend?'':'+' )+usd(e.amount);
  const note=pend?'<div class="small mute">Awaiting review. This value has not been returned yet.</div>':e.settlement_mode==='explicit'?`<div class="small">${esc(e.note)}</div>`:`<div class="small mute">Credit applied to your account.</div>`;
  return `<div class="iou${cls}${pend?' is-pending':''}"><div class="ico">${ICON[e.contract_type]||'•'}</div><div>
    <div class="entry-title"><b>${NAME[e.contract_type]||esc(e.contract_type)}</b><span class="st ${pend?'st-pend':'st-ok'}">${pend?'Pending':'Settled'}</span>${cls?'<span class="st st-ok">New</span>':''}</div>${note}
    <details><summary>Why this entry</summary><ul>${(e.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></details></div>
    <div class="amt">${amount}</div></div>`;
}
let customerRequest=0;
let ledgerFilter='all';
let eventMessage='';
async function viewCust(){
  const request=++customerRequest;
  const [L,sm,list]=await Promise.all([api(`/customers/${S.cust}/ledger`),api(`/customers/${S.cust}/summary`),api('/customers?'+new URLSearchParams({...S.cq,limit:12}))]);
  if(request!==customerRequest||S.view!=='cust')return;
  const tl=[...L.entries].sort((a,b)=>Number(S.newIds.has(b.id))-Number(S.newIds.has(a.id))||String(b.event_at).localeCompare(String(a.event_at))||b.id-a.id);
  const initials=name=>esc(String(name).split(' ').map(x=>x[0]||'').slice(0,2).join(''));
  $('#main').innerHTML=`
  <div class="page-heading"><div><div class="eyebrow">Customer workspace</div><h2>A little less effort.<br>A little more value back.</h2><p>See what has been returned to you, with every credit explained.</p></div><span class="chip syn">Demo &middot; synthetic customer data</span></div>
  <div class="workspace"><div class="primary">
    ${eventMessage?`<section id="simulation-result" class="card" role="status" tabindex="-1" style="border:2px solid var(--accent);scroll-margin-top:20px"><div class="eyebrow">Simulation result</div><h2>Here is what changed</h2><p style="margin:0;line-height:1.7">${esc(eventMessage)}</p></section>`:''}
    <section class="balance-card" aria-label="Returned value"><div class="row sp"><div class="eyebrow">Your value, returned</div><span class="balance-label">Automatic settlement</span></div>
      <div class="hero" id="hero">${usd(sm.we_owe_you_total)}</div><div class="small balance-caption">Total settled value, including the equivalent value of rewards. Already returned to your account.</div>
      <div class="balance-meta"><div><b>${esc(L.customer.name)}</b><br><span>Customer #${L.customer.id} &middot; ${esc(L.customer.segment)} member</span></div><span class="balance-label">${sm.contacts_needed} contacts needed</span></div>
    </section>
    <div class="summary-strip"><div class="summary-item"><div class="eyebrow">Settled</div><b>${sm.settled_items}</b><span>credits returned</span></div><div class="summary-item pending"><div class="eyebrow">Pending</div><b>${sm.pending_items}</b><span>${usd(L.open_or_pending)} not yet returned</span></div><div class="summary-item"><div class="eyebrow">Your effort</div><b>${sm.contacts_needed}</b><span>support contacts</span></div></div>
    <section class="card"><div class="section-head"><h2>Your ledger</h2><span class="tiny mute">${L.entries.length} entries</span></div>
      <div class="ledger-filters" aria-label="Filter ledger entries">${[['all','All activity'],['settled','Settled'],['pending','Pending']].map(([v,l])=>`<button data-ledger="${v}" aria-pressed="${ledgerFilter===v}">${l}</button>`).join('')}</div><div id="list"></div>
    </section>
    <section class="card"><div class="section-head"><h2>From a promise to a credit</h2><span class="tiny mute">How it works</span></div><div class="promise-flow"><div class="promise-step"><span>01</span><b>We check the promise</b><p>Delivery times, prices and rewards are checked against what was promised.</p></div><div class="promise-step"><span>02</span><b>We work out the value</b><p>Eligible credits are calculated. Entries needing review go to a person.</p></div><div class="promise-step"><span>03</span><b>You get it back</b><p>Settled credits appear here, with a clear record of why they were returned.</p></div></div></section>
  </div><aside class="aside">
    <section class="card"><div class="section-head"><h2>Explore customers</h2><span class="tiny mute">${list.total.toLocaleString()} found</span></div><div class="customer-tools">
      <input id="cq" aria-label="Search customers by name or ID" placeholder="Search by name or customer ID" value="${esc(S.cq.q)}">
      <select id="cseg" aria-label="Customer segment"><option value="">All segments</option>${['new','regular','vip'].map(x=>`<option ${S.cq.segment===x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="cfil" aria-label="Customer status">${[['','All customers'],['with_entries','Has credits'],['review','In review'],['holdout','Holdout arm'],['flagged','Flagged'],['no_entries','No credits']].map(([v,l])=>`<option value="${v}" ${S.cq.filter===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="customer-list">${list.items.map(c=>`<button class="customer-item" data-c="${c.id}" aria-pressed="${c.id===S.cust}"><span class="avatar">${initials(c.name)}</span><span class="customer-name"><b>${esc(c.name)}</b><small>#${c.id} &middot; ${esc(c.segment)}${c.holdout?' &middot; holdout':''}</small></span><span class="customer-value">${c.entries?usd(c.returned):'&mdash;'}${c.held?'<span class="st st-pend">In review</span>':''}</span></button>`).join('')||'<div class="empty-state"><b>No customers found</b>Try another name or change the filters.</div>'}</div>
      <div class="pagination"><button class="sec" id="cprev" ${S.cq.offset<=0?'disabled':''} aria-label="Previous customers">&larr;</button><span class="tiny mute">${list.total?S.cq.offset+1:0}&ndash;${Math.min(list.total,S.cq.offset+list.items.length)} of ${list.total.toLocaleString()}</span><button class="sec" id="cnext" ${S.cq.offset+12>=list.total?'disabled':''} aria-label="Next customers">&rarr;</button><button class="sec" id="crand" ${list.total?'':'disabled'}>Random</button></div>
    </section>
    <section class="card demo-card"><div class="eyebrow">Try the experience</div><h2>A missed promise.<br>A credit that finds you.</h2><p>Simulate a late delivery or a price drop for this customer and see how the ledger responds.</p><button class="act" id="ev">Simulate an event &nearr;</button><span id="evs" role="status">${esc(eventMessage)}</span></section>
    <section class="card"><div class="section-head"><h2>Recent activity</h2><span class="tiny mute">Latest 6 entries</span></div>${tl.slice(0,6).map(e=>`<div class="timeline-item"><span class="timeline-dot"></span><div>${NAME[e.contract_type]||esc(e.contract_type)}<small>${esc(String(e.event_at).slice(0,16))} &middot; ${e.pending?'Pending':'Settled'}</small></div><b>${e.currency_or_points==='POINTS'?Math.round(e.amount)+' pts':usd(e.amount)}</b></div>`).join('')||'<div class="empty-state">Activity will appear when a credit is recorded.</div>'}</section>
  </aside></div>`;
  const renderEntries=()=>{const entries=tl.filter(e=>ledgerFilter==='all'||(ledgerFilter==='pending'?e.pending:!e.pending));$('#list').innerHTML=entries.length?entries.map(entryHTML).join(''):'<div class="empty-state"><b>No '+(ledgerFilter==='all'?'ledger':ledgerFilter)+' entries</b>Credits will appear here when they are recorded.</div>';};
  renderEntries();
  $$('[data-ledger]').forEach(b=>b.onclick=()=>{ledgerFilter=b.dataset.ledger;$$('[data-ledger]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderEntries()});
  const reload=()=>{S.cq.offset=0;return viewCust().catch(showCustomerError)};
  let tq;$('#cq').oninput=e=>{const value=e.target.value;clearTimeout(tq);tq=setTimeout(async()=>{S.cq.q=value;await reload();const i=$('#cq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},350)};
  $('#cseg').onchange=e=>{S.cq.segment=e.target.value;reload()};$('#cfil').onchange=e=>{S.cq.filter=e.target.value;reload()};
  $('#cprev').onclick=()=>{S.cq.offset=Math.max(0,S.cq.offset-12);viewCust().catch(showCustomerError)};$('#cnext').onclick=()=>{S.cq.offset+=12;viewCust().catch(showCustomerError)};
  $('#crand').onclick=async()=>{try{const r=await api('/customers?'+new URLSearchParams({...S.cq,limit:1,offset:Math.floor(Math.random()*list.total)}));if(r.items[0]){S.cust=r.items[0].id;S.newIds.clear();eventMessage='';await viewCust()}}catch(e){showCustomerError(e)}};
  $$('[data-c]').forEach(el=>el.onclick=()=>{S.cust=+el.dataset.c;S.newIds.clear();eventMessage='';viewCust().catch(showCustomerError)});
  $('#ev').onclick=async()=>{const b=$('#ev'),st=$('#evs'),customerId=S.cust;b.disabled=true;b.textContent='Simulating...';st.textContent='Checking the promise...';
    const kind=S.evCount++%2===0?'late_order':'price_drop';
    try{
      const r=await post('/simulate/event',{customer_id:customerId,kind});
      if(S.cust!==customerId||S.view!=='cust')return;
      S.newIds=new Set(r.new_entries.map(e=>e.id));ledgerFilter='all';
      const settled=r.new_entries.filter(e=>e.status==='settled');
      const pending=r.new_entries.filter(e=>e.pending);
      const value=entries=>entries.reduce((sum,e)=>sum+(+e.value_usd||0),0);
      const result=[];
      if(settled.length)result.push(`${usd(value(settled))} in value returned across ${settled.length} new credit${settled.length===1?'':'s'}.`);
      if(pending.length){
        result.push(`${usd(value(pending))} added to pending credits. This amount is not included in your returned balance yet.`);
        if(pending.some(e=>e.review_reason==='velocity'))result.push('Repeated late-delivery credits reached the review limit. A person must review these entries in Operations > Review queue.');
        else if(pending.some(e=>e.experiment_arm==='holdout'))result.push('This customer is in the claim-based holdout group; credits are not paid automatically.');
        else result.push('These entries need a review before settlement.');
      }
      eventMessage=result.join(' ')||'Event checked. No new eligible credit was recorded; your returned balance is unchanged.';
      await viewCust();
      const outcome=$('#simulation-result');if(outcome){outcome.focus({preventScroll:true});outcome.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})}
    }
    catch(e){st.textContent='Could not simulate the event: '+e.message;b.disabled=false;b.textContent='Simulate an event'}};
}
function showCustomerError(e){eventMessage='Could not load customer data: '+e.message;const st=$('#evs');if(st)st.textContent=eventMessage;}

/* ---------------- Ops ---------------- */
const TABS=[['overview','Overview'],['review','Review queue'],['graph','Abuse graph'],['exp','Experiment'],['inc','Incidents'],['contracts','Contracts'],['olist','Real: Olist'],['dunn','Real: Grocery'],['twcs','Real: Support'],['models','Models']];
async function viewOps(){
  $('#main').innerHTML=`<div class="page-heading"><div><div class="eyebrow">Operations workspace</div><h2>Keep every promise in view.</h2><p>Track returned value, review held credits and understand the impact.</p></div><span class="chip syn">Synthetic data demo</span></div><nav aria-label="Operations sections" class="tabs" id="tabs">${TABS.map(([k,l])=>`<button data-t="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('')}</nav><div id="pane"></div>`;
  $('#tabs').onclick=e=>{if(e.target.dataset.t){S.tab=e.target.dataset.t;viewOps()}};
  const pane=$('#pane'); pane.innerHTML='<p class="mute">Loading…</p>';
  try{await ({overview:tOverview,review:tReview,graph:tGraph,exp:tExp,inc:tInc,contracts:tContracts,olist:tOlist,dunn:tDunn,twcs:tTwcs,models:tModels})[S.tab](pane)}catch(e){pane.innerHTML=`<div class="note">${esc(e.message)}</div>`}
}
const kpi=(b,s,cls='')=>`<div class="card kpi"><b class="${cls}">${b}</b><span>${s}</span></div>`;
async function tOverview(p){
  const [o,M]=await Promise.all([api('/ops/overview'),api('/ops/metrics')]);
  const mx=Math.max(1,...o.by_contract.map(c=>c.settled));
  p.innerHTML=`<div class="grid g4" style="margin-bottom:14px">
   ${kpi(usd0(o.settled_value_usd),'settled value (value-equivalent)')}${kpi(usd0(o.open_liability_usd),'open liability (review + claim-based holdout)')}
   ${kpi(pc(o.coverage,0),'auto-settlement coverage (treatment arm)')}${kpi((o.median_time_to_settle_h??0).toFixed(1)+' h','median time to settle (nightly batch)')}</div>
   <div class="grid ge"><div class="card"><h2>Settled value by contract</h2>${o.by_contract.map(c=>`<div style="margin-bottom:9px"><div class="row sp small"><span>${ICON[c.t]||''} ${NAME[c.t]||c.t} <span class="mute">(${c.n})</span></span><b>${usd0(c.settled)}</b></div><div style="height:8px;border-radius:4px;background:var(--soft)"><div style="height:8px;border-radius:4px;background:var(--accent);width:${c.settled/mx*100}%"></div></div></div>`).join('')}</div>
   <div class="grid">${kpi(o.review_queue,'entries in the manual review queue','')}${kpi(o.abuse_flags,'customers flagged by the abuse guard')}
   ${kpi(Math.round(M.simulation.contact_deflection.expected_contacts_avoided),'"where is my refund" contacts avoided (expected)')}
   ${kpi(Math.round(M.breakage.points_converted/1000)+'k pts','points converted instead of voided ('+M.breakage.members_converted+' members)')}</div></div>
   <p class="tiny mute" style="margin-top:12px">${esc(M.disclaimer)}</p>`;
}
async function tReview(p){
  const R=S.rq,PG=10,qs=new URLSearchParams({contract:R.contract,reason:R.reason,offset:R.offset,limit:R.mode==='cases'?PG:25});
  const [sum,data]=await Promise.all([api('/ops/review-summary'),api((R.mode==='cases'?'/ops/review-cases?':'/ops/review-queue?')+qs)]);
  const tot=sum.by_contract.reduce((a,x)=>a+x.n,0);
  const chips=sum.by_contract.map(x=>`<span class="chip ${R.contract===x.t?'st-ok':'syn'}" style="cursor:pointer;margin:2px" data-f="${x.t}">${NAME[x.t]||x.t} ${x.n} (${pc(x.n/tot,0)})</span>`).join('');
  const rows=R.mode==='cases'?data.items.map(c=>`<div class="card" style="margin-bottom:10px" id="k${c.customer_id}"><div class="row sp"><div><b>${esc(c.name)}</b> <span class="tiny mute">#${c.customer_id} · ${c.segment}</span> <span class="st st-pend">${esc(c.reason)}</span> <span class="tiny mute">abuse score ${(+c.abuse_score).toFixed(2)}</span></div>
     <div class="row"><b>${usd(c.value_usd)}</b> <span class="small mute">${c.entries} entries held</span><button class="sec" data-ca="approve" data-id="${c.customer_id}">Approve all</button><button class="sec bad" data-ca="deny" data-id="${c.customer_id}">Deny all</button></div></div>
     <div style="margin-top:6px">${Object.entries(c.mix).map(([t,n])=>`<span class="chip syn" style="margin-right:4px">${NAME[t]||t} ×${n}</span>`).join('')}</div>
     <details><summary>Show the ${c.entries} entries</summary><table>${c.entries_list.map(e=>`<tr><td>${NAME[e.contract_type]||e.contract_type}</td><td>${usd(e.value_usd)}</td><td class="small mute">${esc(e.note)}</td></tr>`).join('')}</table></details></div>`).join('')
   :`<div class="card"><table><tr><th>Customer</th><th>Contract</th><th>Value</th><th>Reason</th><th>Abuse score</th><th></th></tr>${data.items.map(r=>`<tr id="r${r.id}"><td>${esc(r.name)}</td><td>${NAME[r.contract_type]||r.contract_type}</td><td>${usd(r.value_usd)}</td><td>${esc(r.review_reason)}</td><td>${(+r.abuse_score).toFixed(2)}</td><td class="row"><button class="sec" data-a="approve" data-id="${r.id}">Approve</button><button class="sec bad" data-a="deny" data-id="${r.id}">Deny</button></td></tr>`).join('')}</table></div>`;
  p.innerHTML=`<div class="grid g4" style="margin-bottom:14px">${kpi(sum.entries,'entries held for a person')}${kpi(sum.customers,'customers (cases)')}${kpi(usd0(sum.value_usd),'value held')}${kpi(sum.by_reason.map(r=>r.r+' '+r.n).join(' · '),'why they were held')}</div>
   <div class="card" style="margin-bottom:12px"><div class="small mute" style="margin-bottom:4px">What is actually in the queue (click to filter). Sorted by <b>risk</b>, not by value, so no single contract dominates the first page.</div>${chips}
    <div class="row" style="margin-top:8px"><div class="seg"><button data-m="cases" aria-pressed="${R.mode==='cases'}">By customer</button><button data-m="entries" aria-pressed="${R.mode==='entries'}">By entry</button></div>
     <select id="rrs"><option value="">all reasons</option>${sum.by_reason.map(r=>`<option ${R.reason===r.r?'selected':''}>${esc(r.r)}</option>`).join('')}</select>
     ${(R.contract||R.reason)?'<button class="sec" id="rclr">Clear filters</button>':''}<span class="small mute">${data.total.toLocaleString()} ${R.mode==='cases'?'cases':'entries'} match</span></div></div>
   ${rows||'<div class="card mute">Nothing matches.</div>'}
   <div class="row sp"><button class="sec" id="rprev" ${R.offset<=0?'disabled':''}>← Prev</button><span class="tiny mute">${data.total?R.offset+1:0}–${Math.min(data.total,R.offset+data.items.length)} of ${data.total}</span><button class="sec" id="rnext" ${R.offset+data.items.length>=data.total?'disabled':''}>Next →</button></div>
   <p class="tiny mute" style="margin-top:8px">Held for a person: ring members, velocity caps, large payouts. The system never denies automatically.</p>`;
  const again=()=>viewOps();

function forceGraph(cv,g){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=420;cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const comps=[...new Set(g.nodes.map(n=>n.comp))],N=g.nodes.map((n,i)=>({...n,x:W/2+Math.cos(comps.indexOf(n.comp)*2.1)*W*.28+(Math.random()-.5)*40,y:H/2+Math.sin(comps.indexOf(n.comp)*2.1)*H*.28+(Math.random()-.5)*40,vx:0,vy:0}));
  const ix=Object.fromEntries(N.map(n=>[n.id,n])),E=g.edges.filter(e=>ix[e.source]&&ix[e.target]);let drag=null,alpha=1;
  const css=getComputedStyle(document.documentElement);
  function step(){alpha*=.985;for(const a of N){for(const b of N){if(a===b)continue;let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;if(d<90){const f=(90-d)/d*.5;a.vx+=dx*f*.05;a.vy+=dy*f*.05}}
      a.vx+=(W/2+Math.cos(comps.indexOf(a.comp)*2.1)*W*.28-a.x)*.002;a.vy+=(H/2+Math.sin(comps.indexOf(a.comp)*2.1)*H*.28-a.y)*.002}
    for(const e of E){const a=ix[e.source],b=ix[e.target],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-45)/d*.04;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
    for(const n of N){if(n===drag)continue;n.vx*=.8;n.vy*=.8;n.x=Math.max(10,Math.min(W-10,n.x+n.vx*alpha*3));n.y=Math.max(10,Math.min(H-10,n.y+n.vy*alpha*3))}}
  function draw(){c.clearRect(0,0,W,H);c.lineWidth=1;c.strokeStyle=css.getPropertyValue('--line').trim()||'#ccc';
    for(const e of E){const a=ix[e.source],b=ix[e.target];c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
    const bad=css.getPropertyValue('--bad').trim(),gr=css.getPropertyValue('--c4').trim();
    for(const n of N){c.beginPath();c.arc(n.x,n.y,4+Math.min(8,n.claims*.9),0,7);c.fillStyle=n.flagged?bad:gr;c.globalAlpha=n.flagged?.9:.6;c.fill();c.globalAlpha=1}}
  (function loop(){step();draw();if(alpha>.02||drag)requestAnimationFrame(loop)})();
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{const[x,y]=pos(e);drag=N.find(n=>Math.hypot(n.x-x,n.y-y)<12)||null;if(drag){alpha=.6;cv.setPointerCapture(e.pointerId)}};
  cv.onpointermove=e=>{if(drag){[drag.x,drag.y]=pos(e);alpha=.4}};cv.onpointerup=()=>{drag=null};
}

   <div class="card"><h2>Price protection on real prices</h2><table><tr><td>Lines with a later drop</td><td>${P.lines_with_drop.toLocaleString()} of ${P.purchase_lines.toLocaleString()}</td></tr><tr><td>Total refund liability</td><td>$${Math.round(P.total_refund).toLocaleString()}</td></tr><tr><td>Mean / median refund per affected line</td><td>$${P.mean_refund_per_affected_line.toFixed(2)} / $${P.median_refund_per_affected_line.toFixed(2)}</td></tr><tr><td>Mean size of the drop</td><td>${pc(P.mean_drop_pct_when_hit,0)}</td></tr></table>
     <div class="small mute">${esc(P.note)} Takeaway: in grocery, a blanket price-protection promise is expensive because promotions are constant (${pc(O.share_sales_discounted,0)} of lines carry a discount). It needs exclusions or caps.</div></div>
   <div class="card"><h2>Do targeted coupon campaigns change behaviour?</h2><table><tr><th></th><th>Matched on past spend</th><th>Not matched</th></tr>
     <tr><td>Extra spend per targeted household</td><td><b>$${m.incremental_spend_per_targeted_household.toFixed(1)}</b> ${ci(m.ci95_spend)}</td><td>$${u.incremental_spend_per_targeted_household.toFixed(1)} ${ci(u.ci95_spend)}</td></tr>
     <tr><td>Still shopping 8 weeks later</td><td>${(m.change_in_share_active_after*100).toFixed(1)} pp ${ci(m.ci95_active.map(x=>x*100))}</td><td>${(u.change_in_share_active_after*100).toFixed(1)} pp</td></tr>
     <tr><td>Coupon cost per household</td><td>$${m.coupon_cost_per_targeted_household.toFixed(2)}</td><td></td></tr>
     <tr><td>Net margin per household (25% margin, assumed)</td><td class="${m.net_margin_per_targeted_household>=0?'good':'badc'}"><b>$${m.net_margin_per_targeted_household.toFixed(2)}</b> ${ci(m.ci95_net)}</td><td>$${u.net_margin_per_targeted_household.toFixed(2)}</td></tr></table>
     <div class="small mute"><b class="badc">The sign flips with the adjustment.</b> ${esc(u.reading)} ${esc(C.design)} ${C.campaigns_analysed} campaigns.</div></div>
  </div>`;
}
async function tTwcs(p){
  const M=await api('/ops/twcs'),O=M.overview,E=M.effort,S=M.spikes;
  p.innerHTML=`<div class="note" style="margin-bottom:14px"><b>REAL data</b>: ${esc(M.dataset)} Not synthetic. Cannot test: ${esc(M.cannot_be_tested)}.</div>
  <div class="grid g4" style="margin-bottom:14px">${kpi(O.customer_threads.toLocaleString(),`customer complaints to ${O.brands} brands (${O.customers.toLocaleString()} customers)`)}
   ${kpi(E.median_reply_min.toFixed(0)+' min',`median wait for a reply (90th percentile ${(E.p90_reply_min/60).toFixed(1)} h)`)}
   ${kpi(pc(E.share_threads_3plus_customer_msgs,0),'of complaints needed 3+ messages from the customer (repeating themselves)','badc')}
   ${kpi(pc(E.recontact_7d,1),'of customers came back to the same brand within 7 days')}</div>
  <div class="grid ge">
   <div class="card"><h2>Incidents discovered from volume spikes</h2><table><tr><th>Brand · window</th><th>Tweets</th><th>What changed (contrast terms)</th></tr>${S.incidents.slice(0,6).map(i=>`<tr><td>${esc(i.brand)}<div class="tiny mute">${i.start} → ${i.end} · ${i.peak_x_baseline.toFixed(1)}× normal</div></td><td>${i.tweets.toLocaleString()}<div class="tiny mute">${i.customers.toLocaleString()} customers</div></td><td class="small">${i.top_terms.slice(0,5).map(esc).join(', ')}<div class="tiny mute">${esc(i.example)}</div></td></tr>`).join('')}</table>
     <div class="small mute">${S.found} brand-day spikes found out of ${S.brand_days_tested.toLocaleString()} tested (about ${S.expected_false.toExponential(0)} expected by chance). These are real events (game-server errors at launch, parcel delays in peak season, train cancellations), found without being told.</div></div>
   <div class="card"><h2>Reply rate by brand</h2><table><tr><th>Lowest</th><th>Reply rate</th><th>Highest</th><th>Reply rate</th></tr>${M.worst_reply_rate.slice(0,5).map((w,i)=>{const b=M.best_reply_rate[i];return `<tr><td>${esc(w.brand)}</td><td>${pc(w.reply_rate,0)}</td><td>${b?esc(b.brand):''}</td><td>${b?pc(b.reply_rate,0):''}</td></tr>`}).join('')}</table>
     <div class="small mute">Caution: the dataset is built from conversations, so unanswered tweets are under-represented (only ${pc(E.no_reply_share,0)} unanswered here). Real-world non-response is higher.</div></div>
   <div class="card"><h2>What customers complain about</h2><table>${Object.entries(M.themes).map(([k,v])=>`<tr><td>${k.replace(/_/g,' ')}</td><td>${pc(v,1)}</td></tr>`).join('')}</table><div class="small mute">Keyword lexicon over all complaint tweets (no labels exist).</div></div>
   <div class="card"><h2>Does a slower reply make customers come back?</h2><table><tr><th>Wait for reply</th><th>Complaints</th><th>Came back in 7d</th><th>Customer messages</th></tr>${E.by_wait.map(w=>`<tr><td>${w.wait}</td><td>${w.n.toLocaleString()}</td><td>${pc(w.recontact_7d,1)}</td><td>${w.customer_msgs.toFixed(2)}</td></tr>`).join('')}</table>
     <div class="small mute">Counter-intuitive: slower replies come with FEWER follow-ups. Customers who wait give up, and urgent issues get fast replies, so this is selection, not proof that waiting is fine.</div></div>
  </div>`;
}
async function tModels(p){
  const cs=await api('/ops/models');
  p.innerHTML=`<div class="note" style="margin-bottom:12px">Model cards. Every number comes from SYNTHETIC data and an assumed response function. No model uses ground-truth columns as features (enforced by a test).</div>
  <div class="grid ge">${cs.map(c=>`<div class="card"><div class="row sp"><b>${esc(c.name)}</b><span class="chip ${c.status.startsWith('ACTIVE')?'st-ok':'syn'}">${esc(c.status)}</span></div>
   <p class="small" style="margin:6px 0">${esc(c.purpose)}</p>
   <dl class="kv"><dt>Features</dt><dd>${esc(c.features)}</dd><dt>Fallback</dt><dd>${esc(c.fallback)}</dd>${Object.entries(c.metrics).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(typeof v==='object'?JSON.stringify(v):v)}</dd>`).join('')}</dl>
   <details open><summary>Known limitations</summary><ul>${c.limits.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></details></div>`).join('')}</div>`;
}

/* ---------------- shell ---------------- */
$('#views').onclick=e=>{const v=e.target.dataset.v;if(!v)return;S.view=v;$$('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));go()};
$('#theme').onclick=()=>{const d=document.documentElement,dark=matchMedia('(prefers-color-scheme: dark)').matches,cur=d.dataset.theme||(dark?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';go()};
function go(){(S.view==='cust'?viewCust:viewOps)().catch(e=>{
  const down=e instanceof TypeError||!navigator.onLine;
  $('#main').innerHTML=down?`<div class="note"><b>Cannot reach the server.</b> The app shell is installed, but the ledger needs the server running. Start it with <code>python run.py</code> (or double-click <code>run.bat</code>) and reload.</div>`
    :`<div class="note">${esc(e.message)}. Is the data seeded? Run <code>python run.py</code>.</div>`})}
/* app shortcuts: /?view=ops opens the Ops view directly */
(()=>{const v=new URLSearchParams(location.search).get('view');if(v==='ops'||v==='cust'){S.view=v;$$('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}})();
/* open on a phone: shows the LAN addresses when the server was started with --share */
$('#phone').onclick=async()=>{const el=$('#sharepanel');if(!el.hidden){el.hidden=true;return}
  try{const s=await api('/ops/share');el.innerHTML=s.shared?`<h2>Open on your phone</h2><div class="small mute">${esc(s.note)}</div>${s.urls.map(u=>`<div style="margin:6px 0"><b style="font-size:18px">${esc(u)}</b></div>`).join('')||'<div class="small badc">No network address found. Are you connected to Wi-Fi?</div>'}${s.hostname_url?`<div class="small mute">or ${esc(s.hostname_url)}</div>`:''}<div class="small mute" style="margin-top:6px">PIN protection: ${s.pin_enabled?'<b class="good">on</b>':'<b class="badc">off</b> (start with --pin 1234)'} · ${esc(s.https_note)}</div>`
    :`<h2>Open on your phone</h2><div class="small">${esc(s.note)}</div>`;el.hidden=false}catch(e){el.innerHTML='<div class="small badc">'+esc(e.message)+'</div>';el.hidden=false}};
/* install as an app (PWA) */
let _ip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();_ip=e;$('#install').hidden=false});
$('#install').onclick=async()=>{if(!_ip)return;_ip.prompt();await _ip.userChoice;_ip=null;$('#install').hidden=true};
addEventListener('appinstalled',()=>{$('#install').hidden=true});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
go();
</script>
