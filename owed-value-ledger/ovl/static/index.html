<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owed-Value Ledger</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1b1d1f;--mute:#6a6f73;--line:#e3e1da;--accent:#0f6b5c;--accent-ink:#fff;--soft:#e6f2ef;--warn:#b4531a;--warnbg:#fbeee3;--bad:#a8261f;--badbg:#fbe7e5;--silent:#5b4bb0;--silentbg:#ece9fa;--c1:#0f6b5c;--c2:#c2562b;--c3:#5b4bb0;--c4:#8a8f94}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161a;--card:#1d2025;--ink:#ecebe6;--mute:#9aa0a6;--line:#2c3036;--accent:#3fb59f;--accent-ink:#06211c;--soft:#173630;--warn:#f0a066;--warnbg:#3a2616;--bad:#f0837c;--badbg:#3b1d1b;--silent:#b3a8f5;--silentbg:#2a2547;--c1:#3fb59f;--c2:#f0a066;--c3:#b3a8f5;--c4:#8a8f94}}
:root[data-theme=dark]{--bg:#14161a;--card:#1d2025;--ink:#ecebe6;--mute:#9aa0a6;--line:#2c3036;--accent:#3fb59f;--accent-ink:#06211c;--soft:#173630;--warn:#f0a066;--warnbg:#3a2616;--bad:#f0837c;--badbg:#3b1d1b;--silent:#b3a8f5;--silentbg:#2a2547;--c1:#3fb59f;--c2:#f0a066;--c3:#b3a8f5;--c4:#8a8f94}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 70px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 14px;font:inherit;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chip{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:99px;font-weight:600}
.syn{background:var(--warnbg);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.15fr .85fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.ge{grid-template-columns:1fr 1fr}
@media(max-width:820px){.g2,.g3,.g4,.ge{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.g2,.g3,.g4,.ge{grid-template-columns:1fr}}
.hero{font-size:52px;font-weight:750;letter-spacing:-.035em;color:var(--accent);line-height:1.05}
h2{font-size:15px;margin:0 0 8px}.mute{color:var(--mute)}.small{font-size:13px}.tiny{font-size:12px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em}.kpi span{color:var(--mute);font-size:12.5px}
.iou{display:grid;grid-template-columns:38px 1fr auto;gap:12px;padding:13px 0;border-top:1px solid var(--line);align-items:start}
.iou:first-of-type{border-top:0}
.iou.new{animation:pop 1.6s ease-out}
@keyframes pop{0%{background:var(--soft);transform:translateY(-6px)}100%{background:transparent;transform:none}}
.ico{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.st{font-size:11px;padding:1px 8px;border-radius:99px;font-weight:600;margin-left:6px;vertical-align:1px}
.st-ok{background:var(--soft);color:var(--accent)}.st-pend{background:var(--warnbg);color:var(--warn)}
details summary{cursor:pointer;color:var(--mute);font-size:12px;margin-top:3px}
details ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--mute)}
button.act{font:inherit;background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
button.act:disabled{opacity:.6;cursor:wait}
button.sec{font:inherit;background:none;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer}
button.bad{color:var(--bad)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:110px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:6px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}th{color:var(--mute);font-weight:500;border-top:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font:inherit;color:var(--mute);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.good{color:var(--accent)}.badc{color:var(--bad)}
svg text{fill:var(--mute);font-size:11px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
canvas{width:100%;height:420px;border:1px solid var(--line);border-radius:10px;background:var(--card);display:block}
.big-inc{font-size:17px;line-height:1.4}.big-inc b{color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv dt{color:var(--mute)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Owed-Value Ledger</h1><div class="tiny mute">What the brand owes the customer, paid before they ask.</div></div>
  <div class="row"><span class="chip syn">Synthetic data demo</span>
    <div class="seg" id="views"><button data-v="cust" aria-pressed="true">Customer</button><button data-v="ops" aria-pressed="false">Ops</button></div>
    <button class="sec" id="theme">Theme</button></div>
</header>
<main id="main"></main>
</div>
<script>
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd=n=>'$'+(+n).toFixed(2), usd0=n=>'$'+Math.round(+n).toLocaleString(), pc=(n,d=1)=>n==null?'n/a':(100*n).toFixed(d)+'%';
const api=(p,o)=>fetch(p,o).then(async r=>{if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);return r.json()});
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
const ICON={late_delivery:'⏱',price_protection:'↓$',expiring_points:'★',unused_subscription:'⏸',devaluation_true_up:'⚖',silent_failure:'◇',incident:'⚠'};
const NAME={late_delivery:'Late delivery',price_protection:'Price protection',expiring_points:'Points kept from expiring',unused_subscription:'Unused add-on paused',devaluation_true_up:'Reward chart true-up',silent_failure:'Likely faulty order',incident:'Operations incident'};
const S={view:'cust',tab:'overview',cust:1,evCount:0,newIds:new Set(),cq:{q:'',segment:'',filter:'',offset:0},rq:{mode:'cases',contract:'',reason:'',offset:0}};

/* ---------------- tiny SVG charts ---------------- */
function lineChart(series,{w=460,h=210,xl='',yl='',xfmt=x=>x,yfmt=y=>y.toFixed(1)}={}){
  const pts=series.flatMap(s=>s.pts), xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(0,...ys),y1=Math.max(0,...ys); if(y1==y0)y1=y0+1;
  const L=44,R=10,T=8,B=30,X=x=>L+(x-x0)/((x1-x0)||1)*(w-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(h-T-B);
  let g=''; for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end">${yfmt(v)}</text>`}
  g+=`<line x1="${L}" x2="${w-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mute)" stroke-dasharray="3 3"/>`;
  [x0,(x0+x1)/2,x1].forEach(v=>g+=`<text x="${X(v)}" y="${h-14}" text-anchor="middle">${xfmt(v)}</text>`);
  g+=`<text x="${(L+w)/2}" y="${h-1}" text-anchor="middle">${xl}</text>`;
  const cols=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
  series.forEach((s,i)=>{g+=`<polyline fill="none" stroke="${cols[i%4]}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} points="${s.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}</svg><div class="legend">${series.map((s,i)=>`<span><i style="background:${cols[i%4]}"></i>${s.name}</span>`).join('')}</div>`;
}
function barChart(items,{w=460,h=190,yfmt=y=>pc(y,0),min=null}={}){
  const vals=items.flatMap(i=>[i.v,(i.lo??i.v),(i.hi??i.v)]); let y0=min??Math.min(0,...vals),y1=Math.max(...vals); if(y1==y0)y1=y0+1;
  const L=44,R=10,T=10,B=34,Y=y=>T+(1-(y-y0)/(y1-y0))*(h-T-B),bw=(w-L-R)/items.length;
  let g=''; for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end">${yfmt(v)}</text>`}
  items.forEach((it,i)=>{const x=L+i*bw+bw*.2,ww=bw*.6,cols=['var(--c1)','var(--c4)','var(--c3)','var(--c2)'];
    g+=`<rect x="${x}" y="${Math.min(Y(it.v),Y(0>y0?0:y0))}" width="${ww}" height="${Math.abs(Y(it.v)-Y(0>y0?0:y0))}" rx="3" fill="${it.c||cols[i%4]}"/>`;
    if(it.lo!=null)g+=`<line x1="${x+ww/2}" x2="${x+ww/2}" y1="${Y(it.lo)}" y2="${Y(it.hi)}" stroke="var(--ink)"/>`;
    g+=`<text x="${x+ww/2}" y="${h-18}" text-anchor="middle">${it.l}</text><text x="${x+ww/2}" y="${Y(it.v)-4}" text-anchor="middle" style="fill:var(--ink)">${yfmt(it.v)}</text>`});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}</svg>`;
}

/* ---------------- Customer view ---------------- */
function entryHTML(e){
  const pend=e.pending, cls=e.id&&S.newIds.has(e.id)?' new':'';
  const amount=e.currency_or_points==='POINTS'?`${Math.round(e.amount).toLocaleString()} pts<div class="tiny mute">${usd(e.value_usd)} value</div>`:'+'+usd(e.amount);
  const note=e.settlement_mode==='explicit'?`<div class="small">${esc(e.note)}</div>`:`<div class="small mute">Credit applied to your account.</div>`;
  return `<div class="iou${cls}"><div class="ico">${ICON[e.contract_type]||'•'}</div><div>
    <div><b>${NAME[e.contract_type]||e.contract_type}</b><span class="st ${pend?'st-pend':'st-ok'}">${pend?'Pending':'Settled'}</span></div>${note}
    <details><summary>Why this entry</summary><ul>${(e.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></details></div>
    <div class="amt">${amount}</div></div>`;
}
async function viewCust(){
  const [L,sm,list0]=await Promise.all([api(`/customers/${S.cust}/ledger`),api(`/customers/${S.cust}/summary`),api('/customers?'+new URLSearchParams({...S.cq,limit:12}))]);
  if(!list0||Array.isArray(list0)||list0.total===undefined)throw new Error('The server is running an OLD version of the API. Stop it and start it again (python run.py)');
  const list=list0;
  const tl=[...L.entries].sort((a,b)=>a.event_at<b.event_at?1:-1);
  $('#main').innerHTML=`<div class="grid g2">
   <div class="card"><h2>${esc(L.customer.name)} · what we owe you</h2>
    <div class="small mute" style="margin-bottom:6px">Customer #${L.customer.id} · ${esc(L.customer.segment)}</div>
    <div class="hero" id="hero">${usd(sm.we_owe_you_total)}</div>
    <div class="small mute">returned automatically · ${sm.settled_items} settled${sm.pending_items?` · ${sm.pending_items} pending`:''} · ${sm.contacts_needed} contacts needed</div>
    <div style="margin-top:10px" id="list">${L.entries.length?L.entries.map(entryHTML).join(''):'<p class="mute">Nothing owed. We checked every promise we made you.</p>'}</div></div>
   <div class="grid">
    <div class="card"><h2>Find a customer <span class="mute small">(${list.total.toLocaleString()} match)</span></h2>
      <div class="row"><input id="cq" placeholder="ID or name, e.g. 3149" value="${esc(S.cq.q)}" style="flex:1;min-width:130px">
        <select id="cseg"><option value="">all segments</option>${['new','regular','vip'].map(x=>`<option ${S.cq.segment===x?'selected':''}>${x}</option>`).join('')}</select>
        <select id="cfil">${[['','everyone'],['with_entries','has credits'],['review','held for review'],['holdout','holdout arm'],['flagged','flagged by abuse guard'],['no_entries','nothing owed']].map(([v,l])=>`<option value="${v}" ${S.cq.filter===v?'selected':''}>${l}</option>`).join('')}</select>
        <button class="sec" id="crand">Random</button></div>
      <div style="margin-top:8px">${list.items.map(c=>`<div class="row sp" data-c="${c.id}" style="padding:6px 8px;border-radius:8px;cursor:pointer;${c.id==S.cust?'background:var(--soft)':''}"><span>${esc(c.name)} <span class="tiny mute">#${c.id} · ${c.segment}</span></span><span class="small">${c.entries?usd(c.returned)+' <span class="tiny mute">('+c.entries+')</span>':'<span class="mute">nothing owed</span>'}${c.held?' <span class="st st-pend">review</span>':''}${c.holdout?' <span class="st syn">holdout</span>':''}</span></div>`).join('')||'<span class="mute small">No customers match.</span>'}</div>
      <div class="row sp" style="margin-top:6px"><button class="sec" id="cprev" ${S.cq.offset<=0?'disabled':''}>← Prev</button><span class="tiny mute">${list.total?S.cq.offset+1:0}–${Math.min(list.total,S.cq.offset+list.items.length)} of ${list.total.toLocaleString()}</span><button class="sec" id="cnext" ${S.cq.offset+12>=list.total?'disabled':''}>Next →</button></div></div>
    <div class="card"><h2>Simulate a new event</h2><div class="small mute">Injects an order into the live database, runs detection and shows the credit arriving. No claim, no contact.</div>
      <div class="row" style="margin-top:10px"><button class="act" id="ev">Simulate new event</button><span class="small mute" id="evs"></span></div></div>
    <div class="card"><h2>Timeline</h2>${tl.length?tl.map(e=>`<div class="small" style="padding:4px 0;border-top:1px solid var(--line)"><span class="mute">${esc(e.event_at.slice(0,16))}</span> · ${NAME[e.contract_type]||e.contract_type} <span class="amt" style="float:right">${e.currency_or_points==='POINTS'?Math.round(e.amount)+' pts':usd(e.amount)}</span></div>`).join(''):'<span class="mute small">No events.</span>'}</div>
    <div class="card small mute"><b style="color:var(--ink)">How credits are shown.</b> When you noticed a problem you get a short factual note. When you probably did not, the credit simply appears. No apologies, no promises: value, not words.</div>
   </div></div>`;
  const reload=()=>{S.cq.offset=0;viewCust()};
  let tq;$('#cq').oninput=e=>{clearTimeout(tq);tq=setTimeout(()=>{S.cq.q=e.target.value;reload();setTimeout(()=>{const i=$('#cq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},50)},350)};
  $('#cseg').onchange=e=>{S.cq.segment=e.target.value;reload()};$('#cfil').onchange=e=>{S.cq.filter=e.target.value;reload()};
  $('#cprev').onclick=()=>{S.cq.offset=Math.max(0,S.cq.offset-12);viewCust()};$('#cnext').onclick=()=>{S.cq.offset+=12;viewCust()};
  $('#crand').onclick=async()=>{const r=await api('/customers?'+new URLSearchParams({...S.cq,limit:1,offset:Math.floor(Math.random()*list.total)}));if(r.items[0]){S.cust=r.items[0].id;S.newIds.clear();viewCust()}};
  $$('[data-c]').forEach(el=>el.onclick=()=>{S.cust=+el.dataset.c;S.newIds.clear();viewCust()});
  $('#ev').onclick=async()=>{const b=$('#ev'),st=$('#evs');b.disabled=true;st.textContent='Detecting…';
    const kind=S.evCount++%2===0?'late_order':'price_drop';
    try{await new Promise(r=>setTimeout(r,700));const r=await post('/simulate/event',{customer_id:S.cust,kind});
      r.new_entries.forEach(e=>S.newIds.add(e.id));st.textContent=r.new_entries.length?`${r.new_entries.length} new credit${r.new_entries.length>1?'s':''} settled`:'Nothing owed for that event';await viewCust();}
    catch(e){st.textContent='Error: '+e.message;b.disabled=false}};
}

/* ---------------- Ops ---------------- */
const TABS=[['overview','Overview'],['review','Review queue'],['graph','Abuse graph'],['exp','Experiment'],['inc','Incidents'],['contracts','Contracts'],['olist','Real: Olist'],['dunn','Real: Grocery'],['twcs','Real: Support'],['models','Models']];
async function viewOps(){
  $('#main').innerHTML=`<div class="tabs" id="tabs">${TABS.map(([k,l])=>`<button data-t="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('')}</div><div id="pane"></div>`;
  $('#tabs').onclick=e=>{if(e.target.dataset.t){S.tab=e.target.dataset.t;viewOps()}};
  const pane=$('#pane'); pane.innerHTML='<p class="mute">Loading…</p>';
  try{await ({overview:tOverview,review:tReview,graph:tGraph,exp:tExp,inc:tInc,contracts:tContracts,olist:tOlist,dunn:tDunn,twcs:tTwcs,models:tModels})[S.tab](pane)}catch(e){pane.innerHTML=`<div class="note">${esc(e.message)}</div>`}
}
const kpi=(b,s,cls='')=>`<div class="card kpi"><b class="${cls}">${b}</b><span>${s}</span></div>`;
async function tOverview(p){
  const [o,M]=await Promise.all([api('/ops/overview'),api('/ops/metrics')]);
  const mx=Math.max(1,...o.by_contract.map(c=>c.settled));
  p.innerHTML=`<div class="grid g4" style="margin-bottom:14px">
   ${kpi(usd0(o.settled_value_usd),'settled value (value-equivalent)')}${kpi(usd0(o.open_liability_usd),'open liability (review + claim-based holdout)')}
   ${kpi(pc(o.coverage,0),'auto-settlement coverage (treatment arm)')}${kpi((o.median_time_to_settle_h??0).toFixed(1)+' h','median time to settle (nightly batch)')}</div>
   <div class="grid ge"><div class="card"><h2>Settled value by contract</h2>${o.by_contract.map(c=>`<div style="margin-bottom:9px"><div class="row sp small"><span>${ICON[c.t]||''} ${NAME[c.t]||c.t} <span class="mute">(${c.n})</span></span><b>${usd0(c.settled)}</b></div><div style="height:8px;border-radius:4px;background:var(--soft)"><div style="height:8px;border-radius:4px;background:var(--accent);width:${c.settled/mx*100}%"></div></div></div>`).join('')}</div>
   <div class="grid">${kpi(o.review_queue,'entries in the manual review queue','')}${kpi(o.abuse_flags,'customers flagged by the abuse guard')}
   ${kpi(Math.round(M.simulation.contact_deflection.expected_contacts_avoided),'"where is my refund" contacts avoided (expected)')}
   ${kpi(Math.round(M.breakage.points_converted/1000)+'k pts','points converted instead of voided ('+M.breakage.members_converted+' members)')}</div></div>
   <p class="tiny mute" style="margin-top:12px">${esc(M.disclaimer)}</p>`;
}
async function tReview(p){
  const R=S.rq,PG=10,qs=new URLSearchParams({contract:R.contract,reason:R.reason,offset:R.offset,limit:R.mode==='cases'?PG:25});
  const [sum,data]=await Promise.all([api('/ops/review-summary'),api((R.mode==='cases'?'/ops/review-cases?':'/ops/review-queue?')+qs)]);
  const tot=sum.by_contract.reduce((a,x)=>a+x.n,0);
  const chips=sum.by_contract.map(x=>`<span class="chip ${R.contract===x.t?'st-ok':'syn'}" style="cursor:pointer;margin:2px" data-f="${x.t}">${NAME[x.t]||x.t} ${x.n} (${pc(x.n/tot,0)})</span>`).join('');
  const rows=R.mode==='cases'?data.items.map(c=>`<div class="card" style="margin-bottom:10px" id="k${c.customer_id}"><div class="row sp"><div><b>${esc(c.name)}</b> <span class="tiny mute">#${c.customer_id} · ${c.segment}</span> <span class="st st-pend">${esc(c.reason)}</span> <span class="tiny mute">abuse score ${(+c.abuse_score).toFixed(2)}</span></div>
     <div class="row"><b>${usd(c.value_usd)}</b> <span class="small mute">${c.entries} entries held</span><button class="sec" data-ca="approve" data-id="${c.customer_id}">Approve all</button><button class="sec bad" data-ca="deny" data-id="${c.customer_id}">Deny all</button></div></div>

function forceGraph(cv,g){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=420;cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const comps=[...new Set(g.nodes.map(n=>n.comp))],N=g.nodes.map((n,i)=>({...n,x:W/2+Math.cos(comps.indexOf(n.comp)*2.1)*W*.28+(Math.random()-.5)*40,y:H/2+Math.sin(comps.indexOf(n.comp)*2.1)*H*.28+(Math.random()-.5)*40,vx:0,vy:0}));
  const ix=Object.fromEntries(N.map(n=>[n.id,n])),E=g.edges.filter(e=>ix[e.source]&&ix[e.target]);let drag=null,alpha=1;
  const css=getComputedStyle(document.documentElement);
  function step(){alpha*=.985;for(const a of N){for(const b of N){if(a===b)continue;let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;if(d<90){const f=(90-d)/d*.5;a.vx+=dx*f*.05;a.vy+=dy*f*.05}}
      a.vx+=(W/2+Math.cos(comps.indexOf(a.comp)*2.1)*W*.28-a.x)*.002;a.vy+=(H/2+Math.sin(comps.indexOf(a.comp)*2.1)*H*.28-a.y)*.002}
    for(const e of E){const a=ix[e.source],b=ix[e.target],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-45)/d*.04;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
    for(const n of N){if(n===drag)continue;n.vx*=.8;n.vy*=.8;n.x=Math.max(10,Math.min(W-10,n.x+n.vx*alpha*3));n.y=Math.max(10,Math.min(H-10,n.y+n.vy*alpha*3))}}
  function draw(){c.clearRect(0,0,W,H);c.lineWidth=1;c.strokeStyle=css.getPropertyValue('--line').trim()||'#ccc';
    for(const e of E){const a=ix[e.source],b=ix[e.target];c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
    const bad=css.getPropertyValue('--bad').trim(),gr=css.getPropertyValue('--c4').trim();
    for(const n of N){c.beginPath();c.arc(n.x,n.y,4+Math.min(8,n.claims*.9),0,7);c.fillStyle=n.flagged?bad:gr;c.globalAlpha=n.flagged?.9:.6;c.fill();c.globalAlpha=1}}
  (function loop(){step();draw();if(alpha>.02||drag)requestAnimationFrame(loop)})();
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{const[x,y]=pos(e);drag=N.find(n=>Math.hypot(n.x-x,n.y-y)<12)||null;if(drag){alpha=.6;cv.setPointerCapture(e.pointerId)}};
  cv.onpointermove=e=>{if(drag){[drag.x,drag.y]=pos(e);alpha=.4}};cv.onpointerup=()=>{drag=null};
}

     <div class="small mute">Poisson test vs a 91-day rolling median. Two known real events are recovered without being told about them. Seller-week bad-review spikes: ${M.seller_incidents.flagged} flagged of ${M.seller_incidents.tested.toLocaleString()} tested (${M.seller_incidents.expected_false.toFixed(2)} expected by chance).</div></div>
   <div class="card"><h2>Silent-failure detector (real labels)</h2><table><tr><td>Task</td><td class="small">${esc(F.task)}</td></tr><tr><td>AUC (temporal test)</td><td>${F.auc.toFixed(3)}</td></tr><tr><td>Top-10% precision / lift</td><td>${pc(F.top10pct_precision,0)} / ${F.lift_top10pct.toFixed(1)}x (base ${pc(F.base_rate_test,1)})</td></tr><tr><td>Brier raw → calibrated</td><td>${F.brier_raw.toFixed(4)} → ${F.brier_calibrated.toFixed(4)}</td></tr></table>
     ${lineChart([{name:'observed',pts:F.reliability.map(r=>[r.mean_pred,r.observed])},{name:'perfect',pts:[[0,0],[Math.max(...F.reliability.map(r=>r.mean_pred)),Math.max(...F.reliability.map(r=>r.mean_pred))]],dash:1}],{xl:'predicted probability',xfmt:x=>x.toFixed(2),yfmt:y=>y.toFixed(2)})}
     <div class="small mute">Weak but real signal; over-predicts slightly after the time shift. Top drivers: ${F.permutation_importance.slice(0,3).map(f=>f.feature).join(', ')}.</div></div>
   <div class="card"><h2>Review text (Portuguese)</h2><table><tr><td>Predict bad review from text, AUC</td><td>${T.auc_bad_review_from_text.toFixed(3)}</td></tr>${Object.entries(T.bad_review_themes).map(([k,v])=>`<tr><td>Bad reviews mentioning: ${k.replace('_',' ')}</td><td>${pc(v,0)}</td></tr>`).join('')}<tr><td>Late low-reviews that mention delay</td><td>${pc(T.share_of_late_low_reviews_mentioning_delay,0)}</td></tr></table>
     <div class="small mute">Top bad-review terms: ${T.top_bad_terms.slice(0,8).map(esc).join(', ')}. ${esc(T.note)}.</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Sample: orders the late-delivery contract would credit</h2><table><tr><th>Order</th><th>Days late</th><th>Order value</th><th>Credit</th><th>Left a low review?</th></tr>${c.sample.map(s=>`<tr><td>${s.order}…</td><td>${s.delay_days}</td><td>R$ ${s.amount}</td><td>R$ ${s.credit}</td><td>${s.wrote_low_review?'yes':'<b>no (silent)</b>'}</td></tr>`).join('')}</table></div>`;
}

     <div class="small mute">${S.found} brand-day spikes found out of ${S.brand_days_tested.toLocaleString()} tested (about ${S.expected_false.toExponential(0)} expected by chance). These are real events (game-server errors at launch, parcel delays in peak season, train cancellations), found without being told.</div></div>
   <div class="card"><h2>Reply rate by brand</h2><table><tr><th>Lowest</th><th>Reply rate</th><th>Highest</th><th>Reply rate</th></tr>${M.worst_reply_rate.slice(0,5).map((w,i)=>{const b=M.best_reply_rate[i];return `<tr><td>${esc(w.brand)}</td><td>${pc(w.reply_rate,0)}</td><td>${b?esc(b.brand):''}</td><td>${b?pc(b.reply_rate,0):''}</td></tr>`}).join('')}</table>

   <div class="card"><h2>What customers complain about</h2><table>${Object.entries(M.themes).map(([k,v])=>`<tr><td>${k.replace(/_/g,' ')}</td><td>${pc(v,1)}</td></tr>`).join('')}</table><div class="small mute">Keyword lexicon over all complaint tweets (no labels exist).</div></div>
